<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregled Pokemona</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pregled Pokemona</h1>
        <select id="pokemonSelect">
            <option value="">Odaberi Pokemona</option>
        </select>
        <button id="showButton">Prikaži</button>

        <div id="pokemonInfo" class="hidden">
            <h2 id="pokemonName"></h2>
            <img id="pokemonImage" src="" alt="Pokemon Slika">
            <p><strong>Visina:</strong> <span id="pokemonHeight"></span></p>
            <p><strong>Težina:</strong> <span id="pokemonWeight"></span></p>
            <p><strong>Tipovi:</strong> <span id="pokemonTypes"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
