<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="tech-stack bg-gray-900 text-white py-16 px-8">
        <div class="max-w-6xl mx-auto text-center">
          <h2 class="text-4xl font-bold mb-6">Tehnologije koje koristim</h2>
          <p class="text-lg text-gray-300 mb-8">Koristim najmodernije alate za izradu responzivnih i vizualno privlačnih web stranica i aplikacija.</p>
          
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            <div class="tech-item flex flex-col items-center">
              <img src="/images/html-logo.png" alt="HTML" class="w-20 h-20 mb-2">
              <span class="text-lg">HTML</span>
            </div>
            <div class="tech-item flex flex-col items-center">
              <img src="/images/css-logo.png" alt="CSS" class="w-20 h-20 mb-2">
              <span class="text-lg">CSS</span>
            </div>
            <div class="tech-item flex flex-col items-center">
              <img src="/images/js-logo.png" alt="JavaScript" class="w-20 h-20 mb-2">
              <span class="text-lg">JavaScript</span>
            </div>
            <div class="tech-item flex flex-col items-center">
              <img src="/images/react-logo.png" alt="React" class="w-20 h-20 mb-2">
              <span class="text-lg">React</span>
            </div>
            <div class="tech-item flex flex-col items-center">
              <img src="/images/webflow-logo.png" alt="Webflow" class="w-20 h-20 mb-2">
              <span class="text-lg">Webflow</span>
            </div>
          </div>
        </div>
      </section>
      
</body>
</html>
