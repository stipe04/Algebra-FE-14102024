<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recenzije Glazbenih Albuma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        .error {
            color: red;
        }
        .favorite {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Recenzije Albuma</h1>
    <form id="reviewForm">
        <label for="albumName">Naziv albuma:</label>
        <input type="text" id="albumName" required>
        <br>
        <label for="rating">Ocjena (1-10):</label>
        <input type="number" id="rating" min="1" max="10" required>
        <br>
        <button type="submit">Dodaj recenziju</button>
        <p class="error" id="errorMessage"></p>
    </form>
    <ul id="reviews"></ul>
    <script>
        document.getElementById("reviewForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let albumName = document.getElementById("albumName").value.trim();
            let rating = document.getElementById("rating").value;
            let errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = "";
            
            if (albumName === "" || rating === "") {
                errorMessage.textContent = "Molimo ispunite sva polja!";
                return;
            }
            
            let listItem = document.createElement("li");
            let currentTime = new Date().toLocaleString();
            listItem.innerHTML = `<strong>${albumName}</strong> - Ocjena: ${rating} (${currentTime})`;
            
            let favoriteButton = document.createElement("button");
            favoriteButton.textContent = "Favorit";
            favoriteButton.addEventListener("click", function() {
                listItem.classList.toggle("favorite");
            });
            
            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Obriši";
            deleteButton.addEventListener("click", function() {
                listItem.remove();
            });
            
            listItem.appendChild(favoriteButton);
            listItem.appendChild(deleteButton);
            document.getElementById("reviews").appendChild(listItem);
            
            document.getElementById("reviewForm").reset();
        });
    </script>
</body>
</html>
